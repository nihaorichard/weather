<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wetter Südstadt</title>

<style>

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
        height: 105px;
        background: #fff;
        color: #000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        flex-shrink: 0;
    }

    .title {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .subtitle {
        font-size: 18px;
        font-weight: 400;
        font-style: italic;
        margin-top: 4px;
    }

    .updated {
        text-align: right;
        font-size: 15px;
        color: #555;
    }

    .updated strong {
        color: #000;
        font-size: 18px;
    }

    /* =========================
       MAIN
       ========================= */

    .main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 30px 25px;
    }

    .section-title {
        font-size: 23px;
        font-weight: 800;
        margin-bottom: 15px;
        letter-spacing: .5px;
    }

    .section-title span {
        font-size: 16px;
        font-weight: normal;
        font-style: italic;
        margin-left: 8px;
        opacity: .65;
    }

    /* =========================
       HOURLY
       ========================= */

    .hourly {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 8px;
        width: 100%;
    }

    .hour {
        background: #111;
        border: 1px solid #292929;
        border-radius: 8px;
        min-width: 0;
        height: 178px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 12px 4px;
    }

    .hour.current {
        border: 2px solid #fff;
        background: #181818;
    }

    .hour-time {
        font-size: 17px;
        font-weight: 800;
    }

    .weather-icon {
        font-size: 42px;
        line-height: 1;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .temperature {
        font-size: 25px;
        font-weight: 800;
    }

    .rain {
        font-size: 12px;
        min-height: 16px;
        opacity: .8;
    }

    /* =========================
       ICON COLORS
       ========================= */

    .sun {
        color: #ffd21c;
    }

    .partly {
        color: #ffd21c;
    }

    .cloud {
        color: #bfc4c9;
    }

    .rain-icon {
        color: #42a5f5;
    }

    .storm {
        color: #b66cff;
    }

    .snow {
        color: #8fd3ff;
    }

    .fog {
        color: #aaa;
    }

    /* =========================
       DAILY
       ========================= */

    .daily-section {
        margin-top: 28px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    .daily {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
        flex: 1;
        min-height: 0;
    }

    .day {
        background: #111;
        border: 1px solid #292929;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 15px 8px;
        min-width: 0;
    }

    .day.today {
        background: #181818;
        border: 2px solid #fff;
    }

    .day-name {
        font-size: 20px;
        font-weight: 800;
    }

    .day-date {
        font-size: 13px;
        opacity: .6;
        margin-top: -4px;
    }

    .day-icon {
        font-size: 48px;
        line-height: 1;
        margin: 8px 0;
    }

    .day-condition {
        font-size: 13px;
        opacity: .7;
        text-align: center;
        min-height: 18px;
    }

    .day-temp {
        font-size: 22px;
        font-weight: 800;
    }

    .day-min {
        font-size: 15px;
        opacity: .55;
        margin-top: 3px;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
        height: 30px;
        flex-shrink: 0;
        text-align: center;
        font-size: 11px;
        color: #555;
    }

    /* =========================
       ERROR
       ========================= */

    .error {
        color: #ff5555;
        text-align: center;
        font-size: 20px;
        padding: 30px;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 1100px) {

        .header {
            height: 85px;
            padding: 0 20px;
        }

        .title {
            font-size: 28px;
        }

        .hourly {
            gap: 4px;
        }

        .hour {
            height: 145px;
        }

        .weather-icon {
            font-size: 32px;
        }

        .temperature {
            font-size: 20px;
        }

        .hour-time {
            font-size: 14px;
        }

        .main {
            padding: 15px;
        }
    }

</style>
</head>


<body>

<!-- =========================
     HEADER
     ========================= -->

<header class="header">

    <div>
        <div class="title">
            WEIMAR SÜDSTADT
        </div>

        <div class="subtitle">
            Wetter · Weather
        </div>
    </div>

    <div class="updated">
        AKTUALISIERT
        <br>
        <strong id="updatedTime">--:--</strong>
    </div>

</header>


<!-- =========================
     MAIN
     ========================= -->

<main class="main">

    <div class="section-title">
        HEUTE
        <span>Today · 2-stündlich</span>
    </div>

    <div id="hourly" class="hourly">
        <!-- JavaScript fills this -->
    </div>


    <section class="daily-section">

        <div class="section-title">
            7 TAGE
            <span>7-day forecast</span>
        </div>

        <div id="daily" class="daily">
            <!-- JavaScript fills this -->
        </div>

    </section>

</main>


<footer class="footer">
    Weather data: Open-Meteo · DWD / ICON
</footer>



<script>

/* =========================================================
   LOCATION
   Weimar Südstadt
   ========================================================= */

const LATITUDE = 50.966747;
const LONGITUDE = 11.329028;


/* =========================================================
   OPEN-METEO API
   ========================================================= */

const API_URL =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + LATITUDE +
    "&longitude=" + LONGITUDE +
    "&timezone=Europe%2FBerlin" +
    "&forecast_days=7" +
    "&temperature_unit=celsius" +
    "&hourly=" +
        "temperature_2m," +
        "weather_code," +
        "precipitation_probability" +
    "&daily=" +
        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min";


/* =========================================================
   REQUEST WEATHER
   ========================================================= */

async function loadWeather() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Weather API error");
        }

        const data = await response.json();

        renderHourly(data);
        renderDaily(data);

        updateTime();

    } catch (error) {

        console.error(error);

        document.getElementById("hourly").innerHTML =
            '<div class="error">Wetterdaten momentan nicht verfügbar</div>';

    }

}


/* =========================================================
   WEATHER CODE
   WMO WEATHER CODES
   ========================================================= */

function weather(code, isDay = true) {

    if (code === 0) {

        return {
            icon: isDay ? "☀️" : "🌙",
            className: "sun",
            text: "Klar"
        };

    }

    if (code === 1 || code === 2) {

        return {
            icon: isDay ? "🌤️" : "☁️",
            className: "partly",
            text: "Teilweise bewölkt"
        };

    }

    if (code === 3) {

        return {
            icon: "☁️",
            className: "cloud",
            text: "Bewölkt"
        };

    }

    if (
        code === 45 ||
        code === 48
    ) {

        return {
            icon: "🌫️",
            className: "fog",
            text: "Nebel"
        };

    }

    if (
        code === 51 ||
        code === 53 ||
        code === 55 ||
        code === 56 ||
        code === 57
    ) {

        return {
            icon: "🌦️",
            className: "rain-icon",
            text: "Nieselregen"
        };

    }

    if (
        code === 61 ||
        code === 63 ||
        code === 65 ||
        code === 66 ||
        code === 67
    ) {

        return {
            icon: "🌧️",
            className: "rain-icon",
            text: "Regen"
        };

    }

    if (
        code === 71 ||
        code === 73 ||
        code === 75 ||
        code === 77
    ) {

        return {
            icon: "❄️",
            className: "snow",
            text: "Schnee"
        };

    }

    if (
        code === 80 ||
        code === 81 ||
        code === 82
    ) {

        return {
            icon: "🌦️",
            className: "rain-icon",
            text: "Regenschauer"
        };

    }

    if (
        code === 85 ||
        code === 86
    ) {

        return {
            icon: "🌨️",
            className: "snow",
            text: "Schneeschauer"
        };

    }

    if (
        code === 95 ||
        code === 96 ||
        code === 99
    ) {

        return {
            icon: "⛈️",
            className: "storm",
            text: "Gewitter"
        };

    }

    return {
        icon: "🌤️",
        className: "cloud",
        text: "Wetter"
    };

}


/* =========================================================
   DETERMINE DAY / NIGHT
   ========================================================= */

function isDayTime(hour) {

    return hour >= 7 && hour < 21;

}


/* =========================================================
   HOURLY DISPLAY
   ========================================================= */

function renderHourly(data) {

    const container =
        document.getElementById("hourly");

    container.innerHTML = "";

    const requestedHours = [
        0,
        2,
        4,
        6,
        8,
        9,
        10,
        12,
        14,
        16,
        18,
        20,
        22
    ];

    const now = new Date();

    const today =
        now.toISOString()
           .slice(0, 10);


    requestedHours.forEach(hour => {

        const index =
            data.hourly.time.findIndex(
                time => time === `${today}T${String(hour).padStart(2, "0")}:00`
            );


        if (index === -1) {
            return;
        }


        const temperature =
            Math.round(
                data.hourly.temperature_2m[index]
            );


        const code =
            data.hourly.weather_code[index];


        const rain =
            data.hourly.precipitation_probability[index];


        const current =
            now.getHours() === hour;


        const info =
            weather(
                code,
                isDayTime(hour)
            );


        const card =
            document.createElement("div");

        card.className =
            "hour" +
            (current ? " current" : "");


        card.innerHTML = `

            <div class="hour-time">
                ${String(hour).padStart(2, "0")} Uhr
            </div>

            <div class="weather-icon ${info.className}">
                ${info.icon}
            </div>

            <div class="temperature">
                ${temperature}°
            </div>

            <div class="rain">
                ${rain > 0 ? "💧 " + rain + "%" : ""}
            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================================================
   DAILY DISPLAY
   ========================================================= */

function renderDaily(data) {

    const container =
        document.getElementById("daily");

    container.innerHTML = "";


    const weekdays = [
        "SO",
        "MO",
        "DI",
        "MI",
        "DO",
        "FR",
        "SA"
    ];


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const date =
            new Date(
                data.daily.time[i] + "T12:00:00"
            );


        const dayName =
            weekdays[date.getDay()];


        const dateText =
            date.toLocaleDateString(
                "de-DE",
                {
                    day: "2-digit",
                    month: "2-digit"
                }
            );


        const max =
            Math.round(
                data.daily.temperature_2m_max[i]
            );


        const min =
            Math.round(
                data.daily.temperature_2m_min[i]
            );


        const code =
            data.daily.weather_code[i];


        const info =
            weather(code, true);


        const card =
            document.createElement("div");


        card.className =
            "day" +
            (i === 0 ? " today" : "");


        card.innerHTML = `

            <div class="day-name">
                ${i === 0 ? "HEUTE" : dayName}
            </div>

            <div class="day-date">
                ${dateText}
            </div>

            <div class="day-icon ${info.className}">
                ${info.icon}
            </div>

            <div class="day-condition">
                ${info.text}
            </div>

            <div>
                <div class="day-temp">
                    ${max}°
                </div>

                <div class="day-min">
                    ${min}°
                </div>
            </div>

        `;


        container.appendChild(card);

    }

}


/* =========================================================
   UPDATE CLOCK
   ========================================================= */

function updateTime() {

    const now = new Date();

    document.getElementById("updatedTime")
        .textContent =
            now.toLocaleTimeString(
                "de-DE",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

}


/* =========================================================
   AUTOMATIC UPDATES
   Every 10 minutes
   ========================================================= */

loadWeather();

setInterval(
    loadWeather,
    10 * 60 * 1000
);


/* Update displayed clock every minute */

setInterval(
    updateTime,
    60 * 1000
);

</script>

</body>
</html>
