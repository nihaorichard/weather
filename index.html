```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wetter Südstadt</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e8f7ff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}


/* =========================
   HEADER
   ========================= */

.header {
    height: 115px;
    background: #fff;
    color: #000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 45px;
    flex-shrink: 0;
}

.title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 23px;
    font-weight: 400;
    font-style: italic;
    margin-top: 5px;
}

.updated {
    text-align: right;
    font-size: 17px;
    color: #555;
}

.updated strong {
    color: #000;
    font-size: 23px;
}


/* =========================
   MAIN
   ========================= */

.main {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;

    padding: 25px 35px 20px;
}

.section-title {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 18px;
    letter-spacing: .5px;
}

.section-title span {
    font-size: 20px;
    font-weight: normal;
    font-style: italic;
    margin-left: 10px;
    opacity: .65;
}


/* =========================
   HOURLY
   ========================= */

.hourly {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 10px;
    width: 100%;
}

.hour {
    background: #c9edff;
    border: 2px solid #8bc9e6;
    border-radius: 10px;

    min-width: 0;
    height: 210px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;

    padding: 15px 5px;
}

.hour.current {
    border: 4px solid #000;
    background: #a9def5;
}


/* TIME */

.hour-time {
    font-size: 22px;
    font-weight: 900;
    white-space: nowrap;
}


/* WEATHER EMOJI */

.weather-icon {
    font-size: 64px;
    line-height: 1;

    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* TEMPERATURE */

.temperature {
    font-size: 34px;
    font-weight: 900;
}


/* RAIN */

.rain {
    font-size: 16px;
    font-weight: 700;
    min-height: 20px;
}


/* =========================
   ICON COLORS
   ========================= */

.sun {
    color: #ffd21c;
}

.partly {
    color: #ffd21c;
}

.cloud {
    color: #777;
}

.rain-icon {
    color: #2196f3;
}

.storm {
    color: #8e44ad;
}

.snow {
    color: #2196f3;
}

.fog {
    color: #777;
}


/* =========================
   DAILY
   ========================= */

.daily-section {
    margin-top: 30px;

    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
}

.daily {
    display: grid;
    grid-template-columns: repeat(7, 1fr);

    gap: 15px;

    flex: 1;
    min-height: 0;
}

.day {
    background: #c9edff;
    border: 2px solid #8bc9e6;
    border-radius: 12px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;

    padding: 18px 10px;

    min-width: 0;
}

.day.today {
    background: #a9def5;
    border: 4px solid #000;
}


/* DAY NAME */

.day-name {
    font-size: 27px;
    font-weight: 900;
}


/* DATE */

.day-date {
    font-size: 17px;
    font-weight: 600;
    opacity: .65;
}


/* BIG DAILY EMOJI */

.day-icon {
    font-size: 72px;
    line-height: 1;

    margin: 8px 0;
}


/* CONDITION */

.day-condition {
    font-size: 17px;
    font-weight: 700;

    text-align: center;

    min-height: 22px;
}


/* MAX TEMPERATURE */

.day-temp {
    font-size: 32px;
    font-weight: 900;
}


/* MIN TEMPERATURE */

.day-min {
    font-size: 21px;
    font-weight: 600;
    opacity: .55;

    margin-top: 3px;
}


/* =========================
   FOOTER
   ========================= */

.footer {
    height: 28px;
    flex-shrink: 0;

    text-align: center;

    font-size: 13px;
    color: #555;
}


/* =========================
   ERROR
   ========================= */

.error {
    color: #d00000;

    text-align: center;

    font-size: 25px;
    font-weight: 700;

    padding: 30px;
}


/* =========================
   SMALLER SCREENS
   ========================= */

@media (max-width: 1400px) {

    .header {
        height: 95px;
        padding: 0 25px;
    }

    .title {
        font-size: 36px;
    }

    .subtitle {
        font-size: 18px;
    }

    .main {
        padding: 18px;
    }

    .hourly {
        gap: 6px;
    }

    .hour {
        height: 180px;
    }

    .weather-icon {
        font-size: 52px;
    }

    .temperature {
        font-size: 27px;
    }

    .hour-time {
        font-size: 18px;
    }

    .day-icon {
        font-size: 58px;
    }

    .day-name {
        font-size: 22px;
    }

}


/* =========================
   VERY SMALL SCREENS
   ========================= */

@media (max-width: 1000px) {

    .title {
        font-size: 28px;
    }

    .hour {
        height: 150px;
        padding: 10px 3px;
    }

    .weather-icon {
        font-size: 42px;
    }

    .temperature {
        font-size: 22px;
    }

    .hour-time {
        font-size: 14px;
    }

    .day-icon {
        font-size: 45px;
    }

    .day-name {
        font-size: 18px;
    }

    .day-temp {
        font-size: 24px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header class="header">

    <div>

        <div class="title">
            WEIMAR SÜDSTADT
        </div>

        <div class="subtitle">
            Wetter · Weather
        </div>

    </div>


    <div class="updated">

        AKTUALISIERT

        <br>

        <strong id="updatedTime">
            --:--
        </strong>

    </div>

</header>



<!-- =========================
     MAIN
     ========================= -->

<main class="main">


    <!-- HOURLY -->

    <div class="section-title">

        HEUTE

        <span>
            Today · 2-stündlich
        </span>

    </div>


    <div
        id="hourly"
        class="hourly"
    >
    </div>



    <!-- DAILY -->

    <section class="daily-section">


        <div class="section-title">

            7 TAGE

            <span>
                7-day forecast
            </span>

        </div>


        <div
            id="daily"
            class="daily"
        >
        </div>


    </section>


</main>



<footer class="footer">

    Weather data: Open-Meteo · DWD / ICON

</footer>



<script>


/* =========================================================
   WEIMAR SÜDSTADT
   ========================================================= */

const LATITUDE = 50.966747;

const LONGITUDE = 11.329028;



/* =========================================================
   OPEN-METEO
   ========================================================= */

const API_URL =

    "https://api.open-meteo.com/v1/forecast" +

    "?latitude=" + LATITUDE +

    "&longitude=" + LONGITUDE +

    "&timezone=Europe%2FBerlin" +

    "&forecast_days=7" +

    "&temperature_unit=celsius" +

    "&hourly=" +

        "temperature_2m," +

        "weather_code," +

        "precipitation_probability" +

    "&daily=" +

        "weather_code," +

        "temperature_2m_max," +

        "temperature_2m_min";



/* =========================================================
   LOAD WEATHER
   ========================================================= */

async function loadWeather() {

    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Weather API error"
            );

        }


        const data =
            await response.json();


        renderHourly(data);

        renderDaily(data);

        updateTime();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "hourly"
        ).innerHTML =

            '<div class="error">' +
            'Wetterdaten momentan nicht verfügbar' +
            '</div>';

    }

}



/* =========================================================
   WEATHER SYMBOLS
   ========================================================= */

function weather(code, isDay = true) {


    if (code === 0) {

        return {

            icon:
                isDay
                ? "☀️"
                : "🌙",

            className:
                "sun",

            text:
                "Klar"

        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {

            icon:
                isDay
                ? "🌤️"
                : "☁️",

            className:
                "partly",

            text:
                "Teilweise bewölkt"

        };

    }


    if (code === 3) {

        return {

            icon: "☁️",

            className:
                "cloud",

            text:
                "Bewölkt"

        };

    }


    if (
        code === 45 ||
        code === 48
    ) {

        return {

            icon: "🌫️",

            className:
                "fog",

            text:
                "Nebel"

        };

    }


    if (
        code === 51 ||
        code === 53 ||
        code === 55 ||
        code === 56 ||
        code === 57
    ) {

        return {

            icon: "🌦️",

            className:
                "rain-icon",

            text:
                "Nieselregen"

        };

    }


    if (
        code === 61 ||
        code === 63 ||
        code === 65 ||
        code === 66 ||
        code === 67
    ) {

        return {

            icon: "🌧️",

            className:
                "rain-icon",

            text:
                "Regen"

        };

    }


    if (
        code === 71 ||
        code === 73 ||
        code === 75 ||
        code === 77
    ) {

        return {

            icon: "❄️",

            className:
                "snow",

            text:
                "Schnee"

        };

    }


    if (
        code === 80 ||
        code === 81 ||
        code === 82
    ) {

        return {

            icon: "🌦️",

            className:
                "rain-icon",

            text:
                "Regenschauer"

        };

    }


    if (
        code === 85 ||
        code === 86
    ) {

        return {

            icon: "🌨️",

            className:
                "snow",

            text:
                "Schneeschauer"

        };

    }


    if (
        code === 95 ||
        code === 96 ||
        code === 99
    ) {

        return {

            icon: "⛈️",

            className:
                "storm",

            text:
                "Gewitter"

        };

    }


    return {

        icon: "🌤️",

        className:
            "cloud",

        text:
            "Wetter"

    };

}



/* =========================================================
   DAY / NIGHT
   ========================================================= */

function isDayTime(hour) {

    return (
        hour >= 7 &&
        hour < 21
    );

}



/* =========================================================
   HOURLY FORECAST
   ========================================================= */

function renderHourly(data) {


    const container =
        document.getElementById(
            "hourly"
        );


    container.innerHTML = "";


    const requestedHours = [

        0,
        2,
        4,
        6,
        8,
        9,
        10,
        12,
        14,
        16,
        18,
        20,
        22

    ];


    const now =
        new Date();


    const today =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Europe/Berlin"
            }
        ).format(now);



    requestedHours.forEach(hour => {


        const targetTime =

            `${today}T${String(hour).padStart(2, "0")}:00`;


        const index =

            data.hourly.time.findIndex(
                time =>
                    time === targetTime
            );


        if (index === -1) {

            return;

        }


        const temperature =

            Math.round(
                data.hourly
                    .temperature_2m[index]
            );


        const code =

            data.hourly
                .weather_code[index];


        const rain =

            data.hourly
                .precipitation_probability[index];


        const current =

            now.getHours() === hour;


        const info =

            weather(
                code,
                isDayTime(hour)
            );


        const card =

            document.createElement(
                "div"
            );


        card.className =

            "hour" +
            (
                current
                ? " current"
                : ""
            );


        card.innerHTML = `

            <div class="hour-time">
                ${String(hour).padStart(2, "0")} Uhr
            </div>

            <div class="weather-icon ${info.className}">
                ${info.icon}
            </div>

            <div class="temperature">
                ${temperature}°
            </div>

            <div class="rain">
                ${
                    rain > 0
                    ? "💧 " + rain + "%"
                    : ""
                }
            </div>

        `;


        container.appendChild(
            card
        );

    });

}



/* =========================================================
   7 DAY FORECAST
   ========================================================= */

function renderDaily(data) {


    const container =
        document.getElementById(
            "daily"
        );


    container.innerHTML = "";


    const weekdays = [

        "SO",
        "MO",
        "DI",
        "MI",
        "DO",
        "FR",
        "SA"

    ];


    for (
        let i = 0;
        i < 7;
        i++
    ) {


        const date =

            new Date(
                data.daily.time[i] +
                "T12:00:00"
            );


        const dayName =

            weekdays[
                date.getDay()
            ];


        const dateText =

            date.toLocaleDateString(
                "de-DE",
                {
                    day:
                        "2-digit",

                    month:
                        "2-digit"
                }
            );


        const max =

            Math.round(
                data.daily
                    .temperature_2m_max[i]
            );


        const min =

            Math.round(
                data.daily
                    .temperature_2m_min[i]
            );


        const code =

            data.daily
                .weather_code[i];


        const info =

            weather(
                code,
                true
            );


        const card =

            document.createElement(
                "div"
            );


        card.className =

            "day" +
            (
                i === 0
                ? " today"
                : ""
            );


        card.innerHTML = `

            <div class="day-name">
                ${i === 0 ? "HEUTE" : dayName}
            </div>

            <div class="day-date">
                ${dateText}
            </div>

            <div class="day-icon ${info.className}">
                ${info.icon}
            </div>

            <div class="day-condition">
                ${info.text}
            </div>

            <div>

                <div class="day-temp">
                    ${max}°
                </div>

                <div class="day-min">
                    ${min}°
                </div>

            </div>

        `;


        container.appendChild(
            card
        );

    }

}



/* =========================================================
   CLOCK
   ========================================================= */

function updateTime() {


    const now =
        new Date();


    document.getElementById(
        "updatedTime"
    ).textContent =

        now.toLocaleTimeString(
            "de-DE",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );

}



/* =========================================================
   START
   ========================================================= */

loadWeather();


/* Refresh weather every 10 minutes */

setInterval(
    loadWeather,
    10 * 60 * 1000
);


/* Refresh clock every minute */

setInterval(
    updateTime,
    60 * 1000
);


</script>

</body>
</html>
```
